services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cesfam
      POSTGRES_USER: cesfam
      POSTGRES_PASSWORD: cesfam_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cesfam -d cesfam"]
      interval: 5s
      timeout: 5s
      retries: 10

  init:
    build: .
    command: ["npm", "run", "db:init"]
    environment:
      DATABASE_URL: postgresql://cesfam:cesfam_dev@db:5432/cesfam
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build: .
    command: ["npm", "run", "dev:backend"]
    environment:
      DATABASE_URL: postgresql://cesfam:cesfam_dev@db:5432/cesfam
      PORT: 3000
      FRONTEND_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      PUBLIC_APP_URL: http://localhost:5173
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_TEST_EMAIL: ${RESEND_TEST_EMAIL:-}
    ports:
      - "3000:3000"
    depends_on:
      init:
        condition: service_completed_successfully

  frontend:
    build: .
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173", "--strictPort"]
    environment:
      API_PROXY_TARGET: http://backend:3000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
